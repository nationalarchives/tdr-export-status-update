name: TDR Run Lambda Tests
on:
  push:
    branches-ignore:
      - main
      - release-*
permissions: {}
jobs:
  test:
    permissions:
      id-token: write
      contents: write
    uses: nationalarchives/tdr-github-actions/.github/workflows/tdr_test.yml@b469512bc31f0425270a12b87ebe68807c3a1daf # v0.0.46
    with:
      repo-name: tdr-export-status-update
      test-command: |
        sbt scalastyle test:scalastyle test
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
